name: Build the DS version

on:
  push:
    paths: ["nds/**", ".github/workflows/nds.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C nds
      - uses: actions/upload-artifact@v4
        with:
          name: breathing-room-nds
          path: nds/breathing-room.nds
